if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    set gfxmode=auto
    terminal_output gfxterm
    set gfxpayload=keep
fi

set default=0
set timeout=0
set timeout_style=hidden
menuentry 'Anser Linux' {
    linux /arch/boot/@ARCH@/vmlinuz-linux-omarchy copytoram=n archisobasedir=arch archisosearchuuid=@ISO_UUID@ @BOOT_OPTIONS@ console=@CONSOLE@,115200n8 console=tty0
    initrd /arch/boot/@ARCH@/initramfs-linux-omarchy.img
}
