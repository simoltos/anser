# Anser build and live package configuration
[options]
Architecture = x86_64
HoldPkg = pacman glibc
Color
ILoveCandy
ParallelDownloads = 10
SigLevel = Required

#[anser-testing]
#Server = https://github.com/simoltos/anser/releases/download/$repo-$arch
[anser]
Server = https://github.com/simoltos/anser/releases/download/$repo-$arch
[core]
SigLevel = DatabaseOptional
Include = /etc/pacman.d/mirrorlist
[extra]
SigLevel = DatabaseOptional
Include = /etc/pacman.d/mirrorlist
[multilib]
SigLevel = DatabaseOptional
Include = /etc/pacman.d/mirrorlist
