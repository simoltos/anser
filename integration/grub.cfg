# Anser boot menu: installed operating systems, not the firmware device menu.
GRUB_DISABLE_BOOTNEXT=true
GRUB_DISABLE_OS_PROBER=false
# Keep installer-provided root and encryption parameters in GRUB_CMDLINE_LINUX.
for anser_boot_option in quiet splash; do
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" $anser_boot_option "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$anser_boot_option" ;;
    esac
done
unset anser_boot_option
